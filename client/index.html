      rel="stylesheet"
    />
    <script>
      // Desregistra Service Workers residuais (ex: Workbox/PWA de outros projetos rodados em localhost:5173)
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister();
          }
        });
        if ('caches' in window) {
          caches.keys().then(function (names) {
            for (var j = 0; j < names.length; j++) {
              caches.delete(names[j]);
            }
          });
        }
      }
    </script>
  </head>
  <body class="bg-linnk-stone-50 text-linnk-obsidian antialiased selection:bg-linnk-flame selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
