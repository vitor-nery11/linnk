<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#161316" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <title>LINNK · Plataforma Operacional & Curadoria Imobiliária</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Desregistra Service Workers residuais (ex: Workbox/PWA de outros projetos rodados em localhost:5173)
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister();
          }
        });
        if ('caches' in window) {
          caches.keys().then(function (names) {
            for (var j = 0; j < names.length; j++) {
              caches.delete(names[j]);
            }
          });
        }
      }
    </script>
  </head>
  <body class="bg-linnk-stone-50 text-linnk-obsidian antialiased selection:bg-linnk-flame selection:text-white">
    <div id="root">
      <div style="min-height: 100vh; background-color: #080605; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 1.5rem;">
          <img src="/linnk-logo-dark.png" alt="linnk" style="height: 40px; width: auto; object-fit: contain;" />
          <div style="display: flex; flex-direction: column; align-items: center; gap: 0.75rem;">
            <div style="width: 32px; height: 32px; border: 3px solid rgba(249, 87, 33, 0.2); border-top-color: #f95721; border-radius: 50%; animation: linnk-spin 1s linear infinite;"></div>
            <p style="margin: 0; font-size: 12px; color: #a3a3a3; font-weight: 500; letter-spacing: 0.025em;">Carregando LINNK...</p>
          </div>
        </div>
      </div>
      <style>
        @keyframes linnk-spin {
          to { transform: rotate(360deg); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
